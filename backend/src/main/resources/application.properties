spring.application.name=branova-backend
server.port=${PORT:8080}
branova.frontend-url=${FRONTEND_URL:http://localhost:5500}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/branova_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Kampala}
spring.datasource.username=${DB_USERNAME:branova}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development convenience only. Use schema migrations and validate in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
